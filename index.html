<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amedeo Marini — Composer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

  <a href="index.html" class="site-logo">
    <img
      src="assets/images/AM-logo.png"
      alt="Amedeo Marini Music"
    >
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Home</a>
    <a href="#about">About</a>
    <a href="#portfolio">Portfolio</a>
    <a href="mailto:amarini.music@gmail.com">Get in Touch</a>
  </nav>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

</header>

<div class="mobile-menu" id="mobileMenu">

  <a href="index.html">Home</a>
  <a href="#about">About</a>
  <a href="#portfolio">Portfolio</a>
  <a href="mailto:amarini.music@gmail.com">Get in Touch</a>

</div>

  <main class="landing">

    <div class="intro">
      <h1>AMEDEO MARINI</h1>
      <p>Composer for games and interactive media</p>
    </div>


    <!-- SOCIAL / CONTACT LINKS -->

 <div class="social-links">

  <a
    href="https://www.youtube.com/@Ame_OST"
    target="_blank"
    rel="noopener noreferrer"
    class="social-button"
    title="YouTube"
  >
    <img
      src="assets/images/Youtube_logo.png"
      alt="YouTube"
    >
  </a>


  <a
    href="https://www.instagram.com/amedeomarini_music/"
    target="_blank"
    rel="noopener noreferrer"
    class="social-button"
    title="Instagram"
  >
    <img
      src="assets/images/Instagram-Icon.png"
      alt="Instagram"
    >
  </a>


  <button
    class="social-button"
    onclick="copyDiscord()"
    title="Copy Discord username"
  >
    <img
      src="assets/images/dcord icon.png"
      alt="Discord"
    >
  </button>


  <a
    href="mailto:amarini.music@gmail.com"
    class="social-button"
    title="Email"
  >
    <img
      src="assets/images/email icon no bg.png"
      alt="Email"
    >
  </a>

</div>


    <!-- PORTFOLIO -->

    <div class="portfolio-buttons">

      <a
        class="portfolio-button cyberpunk"
        href="cyberpunkscifi.html"
      >
        <span>CYBERPUNK — SCI-FI</span>
      </a>


      <a
        class="portfolio-button fantasy"
        href="fantasymusic.html"
      >
        <span>FANTASY — EPIC</span>
      </a>


      <a
        class="portfolio-button chill"
          href="chillandintrospective.html"
      >
        <span>CHILL — INTROSPECTIVE</span>
      </a>

    </div>

  </main>


  <script>
  function copyDiscord() {
    navigator.clipboard.writeText("@amepulses");
    alert("Discord username copied: @amepulses");
  }

  const menuToggle = document.getElementById("menuToggle");
  const mobileMenu = document.getElementById("mobileMenu");

  menuToggle.addEventListener("click", () => {
    const isOpen = mobileMenu.classList.toggle("open");

    menuToggle.setAttribute(
      "aria-expanded",
      isOpen
    );
  });

  mobileMenu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      mobileMenu.classList.remove("open");

      menuToggle.setAttribute(
        "aria-expanded",
        "false"
      );
    });
  });
</script>

</body>
</html>
