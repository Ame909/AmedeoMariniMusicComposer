<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amedeo Marini — Composer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="landing">

    <div class="intro">
      <h1>AMEDEO MARINI</h1>
      <p>Composer for games and interactive media</p>
    </div>


    <!-- SOCIAL / CONTACT LINKS -->

    <div class="social-links">

      <a
        href="https://www.youtube.com/@Ame_OST"
        target="_blank"
        rel="noopener noreferrer"
        class="social-button"
        title="YouTube"
      >
        <img
          src="assets/images/Youtube_logo.png"
          alt="YouTube"
        >
      </a>


      <button
        class="social-button"
        onclick="copyDiscord()"
        title="Copy Discord username"
      >
        <img
          src="assets/images/dcord icon.png"
          alt="Discord"
        >
      </button>


      <a
        href="mailto:amarini.music@gmail.com"
        class="social-button"
        title="Email"
      >
        <img
          src="assets/images/email icon no bg.png"
          alt="Email"
        >
      </a>

    </div>


    <!-- PORTFOLIO -->

    <div class="portfolio-buttons">

      <a
        class="portfolio-button cyberpunk"
        href="cyberpunkscifi.html"
      >
        <span>CYBERPUNK — SCI-FI</span>
      </a>


      <a
        class="portfolio-button fantasy"
        href="fantasymusic.html"
      >
        <span>FANTASY — EPIC</span>
      </a>


      <a
        class="portfolio-button chill"
        href="#"
      >
        <span>CHILL — INTROSPECTIVE</span>
      </a>

    </div>

  </main>


  <script>
    function copyDiscord() {
      navigator.clipboard.writeText("@amepulses");
      alert("Discord username copied: @amepulses");
    }
  </script>

</body>
</html>
